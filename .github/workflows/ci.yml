name: CI Workflow

on:
  push:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Docker Hub (requires configured username and token)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install . ruff
      - run: python -m unittest discover -s test -p test_auth_recovery.py -v
      - run: ruff check xiaomusic/auth.py xiaomusic/device_manager.py xiaomusic/xiaomusic.py test/test_auth_recovery.py
      - run: ruff format --check xiaomusic/auth.py xiaomusic/device_manager.py xiaomusic/xiaomusic.py test/test_auth_recovery.py

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: armv7
            arch: arm/v7
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build without registry credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: xiaomusic:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test
        run: docker run --rm --platform linux/${{ matrix.arch }} xiaomusic:ci /app/.venv/bin/python3 /app/xiaomusic.py -h
      - name: Regression tests in image
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD/test:/app/test:ro" xiaomusic:ci \
            /app/.venv/bin/python3 -m unittest discover -s test -p test_auth_recovery.py -v
      - name: Save tested image
        run: docker save xiaomusic:ci -o xiaomusic-${{ matrix.platform }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.platform }}
          path: xiaomusic-${{ matrix.platform }}.tar
          retention-days: 1

  publish-docker:
    name: Docker Hub publication
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: dockerhub-xiaomusic
      cancel-in-progress: false
    steps:
      - name: Check publication configuration
        id: config
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUBLISH_REQUESTED: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Docker Hub credentials are missing. Configure repository Actions variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Docker Hub credentials are missing; no image has been published."
          fi
          if [[ "$PUBLISH_REQUESTED" != "true" ]]; then
            echo "Build-only run: no image has been published. Only main pushes and main manual runs with publish enabled publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Publication requested but DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Publish only from main to avoid overwriting stable tags from a feature branch."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.config.outputs.publish == 'true'
        with:
          pattern: docker-image-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
        if: steps.config.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.config.outputs.publish == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install digest-only image publisher
        if: steps.config.outputs.publish == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Publish tested revision
        if: steps.config.outputs.publish == 'true'
        env:
          IMAGE: lucaslifes/lucasprivatehub
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for platform in amd64 arm64 armv7; do
            archive="docker-archive:xiaomusic-$platform.tar"
            digest=$(skopeo inspect --format '{{.Digest}}' "$archive")
            skopeo copy --preserve-digests \
              --authfile "$HOME/.docker/config.json" \
              "$archive" "docker://$IMAGE@$digest"
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:xiaomusic" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:xiaomusic"
          docker buildx imagetools inspect --raw "$IMAGE:xiaomusic" > manifest.json
          python3 - <<'PY'
          import json
          with open("manifest.json") as file:
              manifest = json.load(file)
          platforms = {
              (entry["platform"]["os"], entry["platform"]["architecture"],
               entry["platform"].get("variant", ""))
              for entry in manifest["manifests"]
          }
          assert len(platforms) == 3, platforms
          assert any(os == "linux" and arch == "amd64" for os, arch, _ in platforms), platforms
          assert any(os == "linux" and arch == "arm64" for os, arch, _ in platforms), platforms
          assert ("linux", "arm", "v7") in platforms, platforms
          print("Verified three-platform manifest:", sorted(platforms))
          PY
      - name: Publication summary
        if: steps.config.outputs.publish == 'true'
        env:
          IMAGE: lucaslifes/lucasprivatehub:xiaomusic
        run: |
          echo "Published and verified $IMAGE (linux/amd64, linux/arm64, linux/arm/v7). No other tags were created." >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
