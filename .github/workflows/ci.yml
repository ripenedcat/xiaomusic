name: CI Workflow

on:
  push:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Docker Hub (requires configured username and token)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install . ruff
      - run: python -m unittest discover -s test -p test_auth_recovery.py -v
      - run: ruff check xiaomusic/auth.py xiaomusic/device_manager.py xiaomusic/xiaomusic.py test/test_auth_recovery.py
      - run: ruff format --check xiaomusic/auth.py xiaomusic/device_manager.py xiaomusic/xiaomusic.py test/test_auth_recovery.py

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: armv7
            arch: arm/v7
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build without registry credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: xiaomusic:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test
        run: docker run --rm --platform linux/${{ matrix.arch }} xiaomusic:ci /app/.venv/bin/python3 /app/xiaomusic.py -h
      - name: Regression tests in image
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD/test:/app/test:ro" xiaomusic:ci \
            /app/.venv/bin/python3 -m unittest discover -s test -p test_auth_recovery.py -v
      - name: Save tested image
        run: docker save xiaomusic:ci -o xiaomusic-${{ matrix.platform }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.platform }}
          path: xiaomusic-${{ matrix.platform }}.tar
          retention-days: 1

  publish-docker:
    name: Docker Hub publication
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check publication configuration
        id: config
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Docker Hub credentials are missing. Configure repository Actions variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Docker Hub credentials are missing; no image has been published."
          fi
          if [[ "$PUBLISH_REQUESTED" != "true" ]]; then
            echo "Build-only run: no image has been published. Run CI Workflow manually on main with publish enabled after configuring credentials." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Publication requested but DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Publish only from main to avoid overwriting stable tags from a feature branch."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.config.outputs.publish == 'true'
        with:
          pattern: docker-image-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
        if: steps.config.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.config.outputs.publish == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested revision
        if: steps.config.outputs.publish == 'true'
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/xiaomusic
        shell: bash
        run: |
          set -euo pipefail
          for platform in amd64 arm64 armv7; do
            docker load -i "xiaomusic-$platform.tar"
            docker tag xiaomusic:ci "$IMAGE:sha-$GITHUB_SHA-$platform"
            docker push "$IMAGE:sha-$GITHUB_SHA-$platform"
          done
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" \
            "$IMAGE:sha-$GITHUB_SHA-arm64" \
            "$IMAGE:sha-$GITHUB_SHA-armv7"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
      - name: Publication summary
        if: steps.config.outputs.publish == 'true'
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/xiaomusic
        run: echo "Published $IMAGE with latest, main and sha-$GITHUB_SHA tags." >> "$GITHUB_STEP_SUMMARY"
